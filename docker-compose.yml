services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    networks:
      - app

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - app

networks:
  app:
    driver: bridge
